<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420">
<style>
    .box{fill:#ffffff;stroke:#1f7a8c;stroke-width:2;rx:8; ry:8;}
    .label{font:14px 'Arial'; fill:#0b3d91; font-weight:700;}
    .sub{font:12px 'Arial'; fill:#333;}
    .line{stroke:#1f7a8c; stroke-width:2; marker-end:url(#arr);}
</style>
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f7a8c"/>
  </marker>
</defs>

<rect x="30" y="30" width="260" height="100" class="box"/>
<text x="40" y="60" class="label">ccii.py</text>
<text x="40" y="80" class="sub">Gradio launcher - tabs: Overview, Text, PDF, Voice</text>

<rect x="330" y="20" width="240" height="80" class="box"/>
<text x="340" y="45" class="label">tci.py</text>
<text x="340" y="65" class="sub">Text translation + TTS</text>

<rect x="330" y="120" width="240" height="80" class="box"/>
<text x="340" y="145" class="label">pci.py</text>
<text x="340" y="165" class="sub">PDF extraction + translation</text>

<rect x="330" y="220" width="240" height="80" class="box"/>
<text x="340" y="245" class="label">vcci.py</text>
<text x="340" y="265" class="sub">Audio record + STT + TTS</text>

<rect x="610" y="140" width="240" height="120" class="box"/>
<text x="620" y="165" class="label">utils / data / database</text>
<text x="620" y="190" class="sub">Language maps, helpers, logging</text>

<!-- lines -->
<path d="M290,70 L330,60" class="line"/>
<path d="M290,70 L330,160" class="line"/>
<path d="M290,70 L330,260" class="line"/>
<path d="M570,80 L610,200" class="line"/>
</svg>
